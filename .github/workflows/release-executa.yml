name: Release Executa Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            archive_ext: tar.gz
            bin_name: bizpilot-ai-tools
          - platform: darwin-x86_64
            runner: macos-15-intel
            archive_ext: tar.gz
            bin_name: bizpilot-ai-tools
          - platform: linux-x86_64
            runner: ubuntu-latest
            archive_ext: tar.gz
            bin_name: bizpilot-ai-tools
          - platform: windows-x86_64
            runner: windows-latest
            archive_ext: zip
            bin_name: bizpilot-ai-tools.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Executa unit tests
        run: python -m unittest discover -s executas/bizpilot-ai/tests -v

      - name: Install PyInstaller
        run: pip install --upgrade pip pyinstaller

      - name: Build standalone binary
        run: |
          pyinstaller --onefile --clean --name bizpilot-ai-tools executas/bizpilot-ai/bizpilot_ai_plugin.py

      - name: Package archive
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            powershell -Command "Compress-Archive -Path 'dist/${{ matrix.bin_name }}' -DestinationPath 'release-assets/bizpilot-ai-tools-${{ matrix.platform }}.zip' -Force"
          else
            chmod +x "dist/${{ matrix.bin_name }}"
            tar -czf "release-assets/bizpilot-ai-tools-${{ matrix.platform }}.tar.gz" -C dist "${{ matrix.bin_name }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.platform }}
          path: release-assets/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Verify all 4 platform archives
        run: ls -la all-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
